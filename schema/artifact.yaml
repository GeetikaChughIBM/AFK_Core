# ============================================================
# Artifact Envelope Schema
#
# Every artifact produced by an agent must be wrapped in this
# envelope when registered with the ArtifactManager.
# ============================================================

schema_version: "1.0"

# Unique artifact identifier (generated by factory)
artifact_id: "ART-001"

# Task that produced this artifact
task_id: "TASK-001"

# Agent that produced this artifact
producing_agent: "executor"

# Artifact type — determines how the Orchestrator handles it
# Valid types: plan | tasks | research | implementation_report | test_report |
#              change_summary | debug_report | review_report | handoff | state
artifact_type: "test_report"

# Content format
format: "markdown"   # markdown | yaml | json | text | binary

# Path to the actual artifact file (relative to workspace task dir)
path: "artifacts/test-report.md"

# Indicates whether this artifact has been validated by the gate manager
validated: false

# SHA-256 hash of the file content (set by ArtifactManager on registration)
content_hash: ""

# Timestamp when this artifact was produced
produced_at: ""

# Whether this artifact is available for consumption by other agents/tasks
available: true

# Optional: downstream consumers
available_to:
  - agent: "reviewer"
    task_id: "TASK-001"
  - agent: "orchestrator"
